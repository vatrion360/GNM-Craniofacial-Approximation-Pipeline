name: Python and packaging
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install reviewed Python 3.12 runtime
        if: matrix.python == '3.12'
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements-tested-py312.txt
      - run: python -m pip install '.[dev]'
      - run: python -m ruff check cranio addon_v13.py gnm_reconstruct.py tools tests
      - run: python -m pytest -q
      - run: python -m build
      - run: python tools/build_addon.py
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*
  runtime-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit --no-deps --disable-pip -r requirements-tested-py312.txt --format json --output dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-dependency-audit
          path: dependency-audit.json
