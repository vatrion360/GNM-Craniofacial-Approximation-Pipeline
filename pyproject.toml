[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnm-craniofacial"
version = "5.0.0rc1"
description = "Auditable offline GNM craniofacial approximation and Blender markers"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "VATRION"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "trimesh>=4.5,<6"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.9,<1"]

[project.scripts]
gnm-reconstruct = "gnm_reconstruct:main"
gnm-doctor = "cranio.doctor:main"

[tool.setuptools]
packages = ["cranio", "cranio.backend"]
py-modules = ["gnm_reconstruct"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the official model via GNM_MODEL_PATH"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
